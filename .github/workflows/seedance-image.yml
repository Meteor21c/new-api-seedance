name: Build Seedance image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/seedance-video

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.1'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build and check default frontend
        working-directory: web/default
        run: |
          bun run build
          bun run typecheck
          bunx oxlint -c .oxlintrc.json \
            src/features/video-generation \
            src/routes/_authenticated/video/index.tsx \
            src/hooks/use-sidebar-data.ts \
            src/features/channels/constants.ts \
            src/features/channels/lib/channel-utils.ts
          bunx oxfmt --check \
            src/features/video-generation \
            src/routes/_authenticated/video/index.tsx \
            src/hooks/use-sidebar-data.ts \
            src/features/channels/constants.ts \
            src/features/channels/lib/channel-utils.ts

      - name: Test backend additions
        run: |
          go test ./relay/channel/task/fzyinghe
          go test ./controller ./router

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set image name and version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "v1.0.0-rc.16-seedance-${GITHUB_SHA::7}" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:seedance
            ${{ env.IMAGE_NAME }}:seedance-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
